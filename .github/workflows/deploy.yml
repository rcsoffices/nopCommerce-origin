name: Deploy - Manuel

on:
  push:
    branches:
      - kalibeenne
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — teste uniquement la connexion SSH au serveur"
        type: boolean
        required: false
        default: false


jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Dry run — SSH connectivity check
        if: ${{ inputs.dry_run }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "✅ SSH connection successful"
            echo "  host    : $(hostname)"
            echo "  user    : $(whoami)"
            echo "  docker  : $(docker --version)"
            echo "  uptime  : $(uptime -p)"

      - name: Deploy via SSH
        if: ${{ !inputs.dry_run }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          REPO: ${{ github.repository }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: REPO,ENV_FILE
          script: |
            set -euo pipefail
            APP_DIR=/opt/nopcommerce/nopCommerce-origin

            echo "=== Update source code ==="
            if git -C "$APP_DIR" rev-parse --git-dir > /dev/null 2>&1; then
              cd "$APP_DIR"
              git pull origin kalibeenne
            else
              rm -rf "$APP_DIR"
              git clone --depth 1 -b kalibeenne "https://github.com/${REPO}.git" "$APP_DIR"
              cd "$APP_DIR"
            fi

            echo "=== Deployed commit ==="
            GIT_SHA=$(git rev-parse --short HEAD)
            export GIT_SHA
            git log -1 --oneline

            echo "=== Write .env ==="
            printf '%s' "$ENV_FILE" > "$APP_DIR/.env"
            chmod 600 "$APP_DIR/.env"

            echo "=== Build and start services ==="
            docker compose -f kalibeenne-docker-compose.yml up -d 

            echo "=== Prune old images ==="
            docker image prune -f

            echo "=== Health check ==="
            sleep 15
            docker compose -f kalibeenne-docker-compose.yml ps web \
              | grep -q -E "Up|running" \
              && echo "✅ nopcommerce is running" \
              || { echo "❌ nopcommerce failed to start"; \
                   docker compose -f kalibeenne-docker-compose.yml --env-file .env logs --tail=50 web; \
                   exit 1; }
