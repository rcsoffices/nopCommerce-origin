name: CI

on:
  push:
    branches: [kalibeenne]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore src/NopCommerce.sln

      - name: Build
        run: dotnet build src/NopCommerce.sln --no-restore -c Release

      - name: Test
        run: dotnet test src/NopCommerce.sln --no-build -c Release --verbosity normal

  deploy:
      needs: build-and-test
      name: Deploy to VPS
      runs-on: ubuntu-latest
      environment: production
      concurrency:
        group: deploy-production
        cancel-in-progress: false

      steps:
        - name: Deploy via SSH
          uses: appleboy/ssh-action@v1.0.3
          env:
            REPO: ${{ github.repository }}
            ENV_FILE: ${{ secrets.ENV_FILE }}
          with:
            host: ${{ secrets.SSH_HOST }}
            username: ${{ secrets.SSH_USER }}
            key: ${{ secrets.SSH_PRIVATE_KEY }}
            envs: REPO,ENV_FILE
            script: |
              set -euo pipefail
              APP_DIR=/opt/nopcommerce/nopCommerce-origin

              echo "=== Update source code ==="
              if git -C "$APP_DIR" rev-parse --git-dir > /dev/null 2>&1; then
                cd "$APP_DIR"
                git pull origin kalibeenne
              else
                rm -rf "$APP_DIR"
                git clone --depth 1 -b kalibeenne "https://github.com/${REPO}.git" "$APP_DIR"
                cd "$APP_DIR"
              fi

              echo "=== Deployed commit ==="
              GIT_SHA=$(git rev-parse --short HEAD)
              export GIT_SHA
              git log -1 --oneline

              echo "=== Write .env ==="
              printf '%s' "$ENV_FILE" > "$APP_DIR/.env"
              chmod 600 "$APP_DIR/.env"

              echo "=== Build and start services ==="
              docker compose -f kalibeenne-docker-compose.yml up -d --build --timeout 300

              echo "=== Prune old images ==="
              docker image prune -f

              echo "=== Health check ==="
              sleep 15
              docker compose -f kalibeenne-docker-compose.yml ps web \
                | grep -q -E "Up|running" \
                && echo "✅ nopcommerce is running" \
                || { echo "❌ nopcommerce failed to start"; \
                    docker compose -f kalibeenne-docker-compose.yml --env-file .env logs --tail=50 web; \
                    exit 1; }