          - generic [ref=e89]:
            - heading "KALI'STORY" [level=2] [ref=e90]
            - paragraph [ref=e91]: Et si Kalibéenne vous offrait la possibilité de choisir ? Je suis Cindy Bernard, la fondatrice de Kalibéenne et ce choix, j'aurais aimé l'avoir il y a cinq ans lorsque j'ai entamé mon propre cheminement vers l'acceptation de mes cheveux texturés. Comme beaucoup d'entre vous, j'ai traversé une phase de transition entre mes cheveux défrisés et mes cheveux naturels. Et devinez quoi ? Trouver des produits adaptés à cette transition capillaire s'est avéré bien plus difficile que prévu. C'est à ce moment-là que j'ai pris conscience des manques du marché pour nos cheveux texturés.
            - paragraph [ref=e92]: "Kalibéenne, c'est ma réponse à ce constat : des soins capillaires personnalisables, respectueux de la santé et de l'environnement, inclusifs et spécialement conçus pour nous."
            - button "En savoir plus" [ref=e94] [cursor=pointer]
        - generic [ref=e95]:
          - generic [ref=e96]:
            - heading "NOS VALEURS" [level=2] [ref=e97]
            - paragraph [ref=e98]: Chez Kalibéenne, nous nous engageons à offrir des solutions capillaires naturelles de haute qualité, tout en mettant en avant la personnalisation des produits pour répondre aux besoins spécifiques de chaque client.
            - paragraph [ref=e99]: Nous sommes également fiers de notre partenariat avec l'association Flavien, qui soutient la réinsertion des personnes en situation de handicap. Ce partenariat reflète notre engagement envers l'économie sociale et solidaire. Enfin, nous privilégions des pratiques durables pour minimiser notre impact environnemental.
            - link "Découvrir nos partenaires" [ref=e101] [cursor=pointer]:
              - /url: valeurs
          - img [ref=e103]
